name: Night Shift

on:
  schedule:
    # 19:00 UTC = 02:00 Asia/Bangkok (UTC+7)
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      night:
        description: "YYYYMMDD. Empty = today in Bangkok. A night that already ran is a safe no-op (idempotent)."
        required: false
        default: ""

# contents: write  -> the nightly commit can push at all (the repo default was read-only)
# actions: write   -> it can dispatch deploy.yml afterwards. A push made with
#                     GITHUB_TOKEN does NOT trigger other workflows (GitHub blocks
#                     recursive runs), so the deploy has to be asked for by name.
#                     workflow_dispatch is the documented exception, so this works.
permissions:
  contents: write
  actions: write

jobs:
  run-night:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cheap, and it is the class of bug that ate two nights: a workflow that
      # parses but fails at runtime (bad expression, wrong context, typo in a key)
      - name: Lint workflows
        run: |
          curl -sSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json

      - name: Install dependencies
        working-directory: orchestrator
        run: npm ci

      - name: Build
        working-directory: orchestrator
        run: npm run build

      # hash vectors, chain invariants, constitution rules, signature round-trip
      - name: Test
        working-directory: orchestrator
        run: node --test test/night.test.js

      - name: Run night
        working-directory: orchestrator
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.UNIVERSE_ID }}
          LLM_BASE: ${{ secrets.LLM_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          NS_SIGNING_KEY: ${{ secrets.NS_SIGNING_KEY }}
        run: |
          NIGHT="${{ github.event.inputs.night }}"
          if [ -z "$NIGHT" ]; then NIGHT=$(TZ=Asia/Bangkok date +%Y%m%d); fi
          export NIGHT
          echo "NIGHT=$NIGHT"
          node dist/index.js

      # DataStore is the truth; site/ is derived from it. Rebuild before anyone
      # checks the files, so a night that ran while a push was failing still
      # lands, and a hesitation that never wrote a log line still gets published.
      - name: Resync site from DataStore
        if: always()
        working-directory: orchestrator
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.UNIVERSE_ID }}
          LLM_BASE: ${{ secrets.LLM_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          NIGHT="${{ github.event.inputs.night }}"
          if [ -z "$NIGHT" ]; then NIGHT=$(TZ=Asia/Bangkok date +%Y%m%d); fi
          export NIGHT
          node dist/resync.js

      - name: Verify chain
        if: always()
        working-directory: orchestrator
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.UNIVERSE_ID }}
          LLM_BASE: ${{ secrets.LLM_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          NIGHT="${{ github.event.inputs.night }}"
          if [ -z "$NIGHT" ]; then NIGHT=$(TZ=Asia/Bangkok date +%Y%m%d); fi
          export NIGHT
          node dist/status.js

      - name: Commit log + previews + raw + telemetry + pubkey
        id: commit
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: "site/log.jsonl site/previews/*.svg site/raw/*.json site/telemetry.jsonl site/pubkey.pem"
          commit_message: "night shift: ${{ github.run_id }}"

      # A push from GITHUB_TOKEN cannot trigger another workflow, so the Pages
      # deploy has to be dispatched explicitly. Without this the commit lands and
      # the site keeps serving the previous night — green everywhere, stale page.
      - name: Deploy site to Pages
        if: always() && steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

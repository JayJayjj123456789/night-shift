name: Night Shift

on:
  schedule:
    # 19:00 UTC = 02:00 Asia/Bangkok (UTC+7)
    #
    # Two slots, not one. GitHub's scheduler is best-effort: the only scheduled
    # run this repo has ever had arrived 2h59m late, and a dropped slot is
    # indistinguishable from a night that worked — the plot simply does not grow.
    # The second slot is a retry. The idempotent guard in index.ts makes it a
    # no-op when the first one succeeded, so the cost of the spare is one runner
    # minute and the benefit is a night that is not silently lost.
    - cron: "0 19 * * *"
    - cron: "0 23 * * *"   # 06:00 Bangkok, retry
  workflow_dispatch:
    inputs:
      night:
        description: "YYYYMMDD. Empty = today in Bangkok. A night that already ran is a safe no-op (idempotent)."
        required: false
        default: ""

# contents: write  -> the nightly commit can push at all (the repo default was read-only)
# actions: write   -> it can dispatch deploy.yml afterwards. A push made with
#                     GITHUB_TOKEN does NOT trigger other workflows (GitHub blocks
#                     recursive runs), so the deploy has to be asked for by name.
#                     workflow_dispatch is the documented exception, so this works.
permissions:
  contents: write
  actions: write

# One night at a time.
#
# The guard in index.ts is a read-then-write: two runs that start together both
# read the same ns:state, both build, and the second PATCH overwrites the first
# work's place in the index. The chain then holds a work nothing points at, and
# the night is lost with a green checkmark. cancel-in-progress stays false so a
# manual dispatch waits for the cron instead of killing a night mid-build.
concurrency:
  group: night-shift
  cancel-in-progress: false

jobs:
  run-night:
    runs-on: ubuntu-latest
    # A hung LLM fetch must not hold the concurrency group for the default 6h.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # cheap, and it is the class of bug that ate two nights: a workflow that
      # parses but fails at runtime (bad expression, wrong context, typo in a key)
      - name: Lint workflows
        run: |
          curl -sSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json

      - name: Install dependencies
        working-directory: orchestrator
        run: npm ci

      - name: Build
        working-directory: orchestrator
        run: npm run build

      # hash vectors, chain invariants, constitution rules, signature round-trip
      - name: Test
        working-directory: orchestrator
        run: node --test test/night.test.js

      # A typo in the `night` input used to reach the hash as NaN and poison the
      # chain. Fail before anything is written.
      #
      # The check lives in tools/validate-night.js, not inline. Inline it was
      # `node -e '...'`, shellcheck fired SC2016 on the template literals, and
      # actionlint fails the Lint step on any finding — which skipped a whole
      # night (run #21). A file is lintable and testable; a YAML snippet is not.
      - name: Validate NIGHT
        working-directory: orchestrator
        run: |
          NIGHT="${{ github.event.inputs.night }}"
          if [ -z "$NIGHT" ]; then NIGHT=$(TZ=Asia/Bangkok date +%Y%m%d); fi
          node tools/validate-night.js "$NIGHT"

      - name: Run night
        working-directory: orchestrator
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.UNIVERSE_ID }}
          LLM_BASE: ${{ secrets.LLM_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          NS_SIGNING_KEY: ${{ secrets.NS_SIGNING_KEY }}
        run: |
          NIGHT="${{ github.event.inputs.night }}"
          if [ -z "$NIGHT" ]; then NIGHT=$(TZ=Asia/Bangkok date +%Y%m%d); fi
          export NIGHT
          echo "NIGHT=$NIGHT"
          node dist/index.js

      # DataStore is the truth; site/ is derived from it. Rebuild before anyone
      # checks the files, so a night that ran while a push was failing still
      # lands, and a hesitation that never wrote a log line still gets published.
      - name: Resync site from DataStore
        if: always()
        working-directory: orchestrator
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.UNIVERSE_ID }}
          LLM_BASE: ${{ secrets.LLM_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          NIGHT="${{ github.event.inputs.night }}"
          if [ -z "$NIGHT" ]; then NIGHT=$(TZ=Asia/Bangkok date +%Y%m%d); fi
          export NIGHT
          node dist/resync.js

      - name: Verify chain
        if: always()
        working-directory: orchestrator
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.UNIVERSE_ID }}
          LLM_BASE: ${{ secrets.LLM_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          NIGHT="${{ github.event.inputs.night }}"
          if [ -z "$NIGHT" ]; then NIGHT=$(TZ=Asia/Bangkok date +%Y%m%d); fi
          export NIGHT
          node dist/status.js

      - name: Commit log + previews + raw + telemetry + pubkey
        id: commit
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: "site/log.jsonl site/previews/*.svg site/raw/*.json site/telemetry.jsonl site/pubkey.pem"
          commit_message: "night shift: ${{ github.run_id }}"

      # A push from GITHUB_TOKEN cannot trigger another workflow, so the Pages
      # deploy has to be dispatched explicitly. Without this the commit lands and
      # the site keeps serving the previous night — green everywhere, stale page.
      - name: Deploy site to Pages
        if: always() && steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

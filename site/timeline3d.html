<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Night Shift — 3D Plot</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #08080a; color: #ccc; overflow: hidden; }
  #status { position: fixed; top: 12px; left: 16px; font-size: .8rem; color: #888; background: rgba(0,0,0,.72); padding: 6px 10px; border-radius: 6px; z-index: 5; }
  #status b { color: #4c4; }
  .nav { position: fixed; top: 12px; right: 16px; z-index: 6; display: flex; gap: .35rem; align-items: center; }
  .nav a, .nav button { color: #4c4; background: rgba(0,0,0,.65); border: 1px solid #1e2a1e; border-radius: 6px; text-decoration: none; font: inherit; font-size: .75rem; padding: 6px 10px; cursor: pointer; }
  .nav a:hover, .nav button:hover { background: #12200f; }
  .nav a.on { background: #12200f; border-color: #2e5a2a; color: #7f7; }
  .hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: .72rem; color: #555; z-index: 5; white-space: nowrap; }
  .legend { position: fixed; left: 16px; bottom: 52px; z-index: 5; background: rgba(0,0,0,.72); border: 1px solid #1a1a1a; border-radius: 8px; padding: .6rem .7rem; font-size: .72rem; line-height: 1.7; color: #999; min-width: 148px; }
  #scale { position: fixed; left: 16px; bottom: 16px; z-index: 5; font-size: .68rem; color: #4d4d4d; }
  .legend div { display: flex; align-items: center; gap: .45rem; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .legend .n { color: #666; margin-left: auto; padding-left: .6rem; }
  .tooltip { position: fixed; background: #0e0e12; border: 1px solid #2a2a35; padding: .55rem .7rem; border-radius: 6px; font-size: .75rem; line-height: 1.5; pointer-events: none; display: none; z-index: 10; max-width: 320px; white-space: pre-wrap; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
  .tooltip b { color: #eee; }
  .tooltip .dim { color: #777; }
  canvas { display: block; }

  /* ?embed=1 — used by index.html, which puts this plot in a frame and draws
     its own header, legend and footer around it. One 3D implementation, no copy. */
  html.embed #status, html.embed .nav, html.embed .legend,
  html.embed #scale, html.embed .hint { display: none; }
</style>
<script>
  if (new URLSearchParams(location.search).get("embed")) {
    document.documentElement.classList.add("embed");
  }
</script>
</head>
<body>
<div id="status">กำลังโหลด…</div>
<div class="nav">
  <a href="index.html">journal</a>
  <a href="timeline.html">2D</a>
  <a href="timeline3d.html" id="lnk-real">3D real</a>
  <a href="timeline3d.html?src=sim.jsonl" id="lnk-sim">3D sim 30</a>
  <button id="reset" title="กลับมุมเริ่มต้น">reset view</button>
</div>
<div class="legend" id="legend"></div>
<div id="scale"></div>
<div class="hint">ลากหมุน · scroll ซูม · ชี้ที่ชิ้นงานเพื่ออ่านบันทึก</div>
<div class="tooltip" id="tip"></div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const SRC = new URLSearchParams(location.search).get('src') || 'log.jsonl';
const isSim = SRC.includes('sim');

// form -> colour + physical character of the object.
// baseH is the form's real height character (studs); footprint is the ground
// area it occupies. Both come from the builder, not invented here.
const FORM_META = {
  monolith: { color: 0xe8e8e8, baseH: 3.0, footprint: 16, shape: 'box'      },
  garden:   { color: 0x7fb069, baseH: 1.2, footprint: 26, shape: 'cylinder' },
  machine:  { color: 0xf59e0b, baseH: 1.8, footprint: 18, shape: 'hex'      },
  text:     { color: 0x60a5fa, baseH: 1.0, footprint: 22, shape: 'plate'    },
  light:    { color: 0xfde68a, baseH: 2.4, footprint: 7,  shape: 'spire'    },
  void:     { color: 0x64748b, baseH: 0.6, footprint: 10, shape: 'sphere'   },
};

const HEIGHT_MAX = 95;    // tallest column, scene units
const HEIGHT_MIN = 10;    // floor so nothing is invisible
const VERTICAL_EXAG = 24; // real height is stretched for readability

const $ = id => document.getElementById(id);

function makeGeometry(meta, h) {
  const f = meta.footprint;
  switch (meta.shape) {
    case 'cylinder': return new THREE.CylinderGeometry(f / 2, f / 2, h, 24);
    case 'hex':      return new THREE.CylinderGeometry(f / 2, f / 2, h, 6);
    case 'plate':    return new THREE.BoxGeometry(f, h, 3);
    case 'spire':    return new THREE.CylinderGeometry(1.5, f / 2, h, 8);
    case 'sphere':   return new THREE.SphereGeometry(f / 2, 16, 12);
    default:         return new THREE.BoxGeometry(f, h, f);
  }
}

// ── parts rendering ────────────────────────────────────────────────────
// Same rules the builder and the SVG preview use, so a work looks like itself
// in all three places. pos is the CENTRE of the part in studs.

const PALETTE = {
  ink: 0x0b1220, slate: 0x334155, bone: 0xd6cbb8, rust: 0x9a4b2b,
  amber: 0xe0a33a, jade: 0x3f9e7a, sky: 0x5aa9e6, violet: 0x8b6bd9,
};

/** [width, height, depth] — round shapes read width as diameter. */
// Size of one part in studs — the shape the BUILDER will actually make.
//
// cone and torus have no Roblox primitive without an asset, so builder.lua
// builds them as a BLOCK of [size0, size1, size2]. This page used to draw a
// cone and a ring with size0 read as a radius and doubled, ignoring size2
// entirely: the site showed a different object from the one standing in the
// game. The page's job is to show what exists, so it draws the block.
function partSize(p) {
  switch (p.shape) {
    case 'plate':
    case 'block':
    case 'wedge':
    case 'cone':
    case 'torus': return { w: p.size[0], h: p.size[1], d: p.size[2] };
    default: return { w: p.size[0], h: p.size[0], d: p.size[0] };
  }
}

function partGeometry(p) {
  const { w, h, d } = partSize(p);
  switch (p.shape) {
    case 'cylinder': return new THREE.CylinderGeometry(w / 2, w / 2, h, 24);
    case 'sphere':   return new THREE.SphereGeometry(w / 2, 24, 18);
    case 'wedge':    return new THREE.CylinderGeometry(w / 2, w / 2, h, 3, 1);
    default:         return new THREE.BoxGeometry(w, h, d);
  }
}

function partMaterial(p) {
  const color = PALETTE[p.color] ?? PALETTE.bone;
  switch (p.material) {
    case 'neon':
      return new THREE.MeshStandardMaterial({
        color, emissive: color, emissiveIntensity: p.emissive ?? 1, roughness: 0.4, metalness: 0,
      });
    case 'glass':
      return new THREE.MeshPhysicalMaterial({
        color, roughness: 0.05, metalness: 0, transmission: 0.9, thickness: 5,
        transparent: true, opacity: 0.6,
      });
    case 'metal':
      return new THREE.MeshStandardMaterial({ color, roughness: 0.25, metalness: 0.85 });
    default:
      return new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0.05 });
  }
}

async function main() {
  const status = $('status');
  const res = await fetch(SRC, { cache: 'no-store' });
  if (!res.ok) { status.textContent = 'error ' + res.status + ': ' + res.statusText; return; }
  const entries = (await res.text()).trim().split('\n').filter(Boolean).map(l => JSON.parse(l));

  entries.sort((a, b) => a.night - b.night || (a.id < b.id ? -1 : 1));

  const forms = [...new Set(entries.map(e => e.form))].sort();
  // An empty plot is a state, not an error: draw the ground, the grid and the
  // axis and say so. It used to `return` here, so on a fresh plot the landing
  // page framed a black rectangle — the first thing anyone sees after a reset.
  status.innerHTML = !entries.length
    ? (isSim ? '<b>SIM</b> ยังไม่มีข้อมูล' : 'plot ว่าง · คืนแรกจะเกิดตอน 02:00')
    : isSim
      ? `<b>SIM</b> ${entries.length} nights · ${forms.length} forms`
      : `<b>${entries.length}</b> real works · ${forms.length} forms`;

  if (entries.length) (isSim ? $('lnk-sim') : $('lnk-real')).classList.add('on');
  if (!forms.length) $('legend').style.display = 'none';

  // ── scene ──────────────────────────────────────────────────────────────
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x08080a);
  scene.fog = new THREE.Fog(0x08080a, 750, 1600);

  const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 4000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2 - 0.03; // never dive under the floor
  controls.minDistance = 40;
  controls.maxDistance = 1500;

  scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1a1a, 1.1));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(240, 420, 180);
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x4466ff, 0.55);
  rim.position.set(-300, 120, -260);
  scene.add(rim);

  // ground: the real 512×512 build plane
  const grid = new THREE.GridHelper(512, 16, 0x3d6b3d, 0x243524);
  grid.position.y = 0.1;
  scene.add(grid);
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(512, 512),
    new THREE.MeshStandardMaterial({ color: 0x101016, roughness: 1, metalness: 0 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.6;
  scene.add(floor);

  const axisMat = new THREE.LineBasicMaterial({ color: 0x2e5a2a });
  const seg = (a, b) => new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), axisMat);
  scene.add(seg(new THREE.Vector3(-256, 0.2, 0), new THREE.Vector3(256, 0.2, 0)));
  scene.add(seg(new THREE.Vector3(0, 0.2, -256), new THREE.Vector3(0, 0.2, 256)));
  scene.add(seg(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, HEIGHT_MAX, 0)));

  // ── build ──────────────────────────────────────────────────────────────
  // raw height = form's height character × the work's own params.height.
  // normalised so the tallest column is HEIGHT_MAX and the shortest still reads.
  const raws = entries.map(e => (FORM_META[e.form] || FORM_META.void).baseH * ((e.params && e.params.height) || 0.5));
  const rawMax = raws.length ? Math.max(...raws) : 1;

  const tip = $('tip');
  const group = new THREE.Group();
  const pickable = [];
  const anim = [];   // parts that spin or float

  entries.forEach((e, i) => {
    // ── assembly (parts) ────────────────────────────────────────────────
    // A work may carry an explicit part list instead of one templated
    // primitive. Works built before that schema have none and fall through to
    // the form rendering below, so nothing already published changes.
    if (Array.isArray(e.parts) && e.parts.length) {
      const pivot = new THREE.Group();
      pivot.position.set(e.site.x, 0, e.site.z);
      e.parts.forEach((p, pi) => {
        const mesh = new THREE.Mesh(partGeometry(p), partMaterial(p));
        mesh.position.set(p.pos[0], p.pos[1], p.pos[2]);
        if (p.rot) mesh.rotation.set(
          p.rot[0] * Math.PI / 180, p.rot[1] * Math.PI / 180, p.rot[2] * Math.PI / 180,
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData = { ...e, _part: pi };
        pivot.add(mesh);
        pickable.push(mesh);
        if (p.spin) anim.push({ m: mesh, mode: 'spin', speed: p.spin });
        if (p.float) anim.push({ m: mesh, mode: 'float', speed: p.float, base: p.pos[1] });
        if ((p.emissive || 0) > 0) {
          const light = new THREE.PointLight(PALETTE[p.color] ?? 0xffffff, p.emissive * 0.7, 90);
          light.position.set(p.pos[0], p.pos[1] + partSize(p).h / 2, p.pos[2]);
          pivot.add(light);
        }
      });
      group.add(pivot);
      return;
    }

    const meta = FORM_META[e.form] || FORM_META.void;
    const h = HEIGHT_MIN + (raws[i] / rawMax) * (HEIGHT_MAX - HEIGHT_MIN);
    const mesh = new THREE.Mesh(
      makeGeometry(meta, h),
      new THREE.MeshStandardMaterial({
        color: meta.color, roughness: 0.45, metalness: 0.15,
        emissive: new THREE.Color(meta.color), emissiveIntensity: 0.04,
      })
    );

    const y = meta.shape === 'sphere' ? meta.footprint / 2 : h / 2;
    mesh.position.set(e.site.x, y, e.site.z);

    if (e.form === 'light') {
      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(3, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xfde68a })
      );
      bulb.position.set(0, h / 2 + 3, 0);
      mesh.add(bulb);
      const halo = new THREE.PointLight(0xfde68a, 0.9, 140);
      halo.position.set(0, h / 2, 0);
      mesh.add(halo);
    }

    mesh.userData = { ...e, _h: h };
    group.add(mesh);
    pickable.push(mesh);
  });
  scene.add(group);

  // ── camera framing ─────────────────────────────────────────────────────
  // Frame the works AND the 512 plane, then solve for the distance instead of
  // guessing one. The previous version took the bounding-box radius and
  // multiplied by 1.65, which happened to work at one aspect ratio: after the
  // 2026-11-04 work landed at (-131,-190) the plot's far corner n20261026-a at
  // (188,197) projected to y = -1.32 and fell off the bottom of the screen. The
  // page was hiding its own work.
  //
  // So: take the eight corners of the union box, and double the distance until
  // every corner projects inside the viewport with a margin. Cheap, exact, and
  // it holds for any window shape.
  const box = new THREE.Box3().setFromObject(group);
  box.expandByPoint(new THREE.Vector3(-256, 0, -256));
  box.expandByPoint(new THREE.Vector3(256, 0, 256));
  const centre = box.getCenter(new THREE.Vector3());
  centre.y = HEIGHT_MAX * 0.34;

  const CORNERS = [];
  for (const x of [box.min.x, box.max.x]) {
    for (const y of [box.min.y, box.max.y]) {
      for (const z of [box.min.z, box.max.z]) CORNERS.push(new THREE.Vector3(x, y, z));
    }
  }

  const MARGIN = 0.92;

  /** Place the camera at distance d and report whether everything still fits. */
  function fits(d) {
    camera.position.set(centre.x + d * 0.6, centre.y + d * 0.7, centre.z + d * 0.6);
    controls.target.copy(centre);
    camera.lookAt(centre);
    camera.updateMatrixWorld();
    return CORNERS.every((c) => {
      const v = c.clone().project(camera);
      return Math.abs(v.x) <= MARGIN && Math.abs(v.y) <= MARGIN && v.z < 1;
    });
  }

  function frameView() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    let d = 250;
    // doubling, then a short bisection: the fit is monotone in d
    while (!fits(d) && d < 4000) d *= 1.35;
    let lo = d / 1.35;
    let hi = d;
    for (let i = 0; i < 24; i++) {
      const mid = (lo + hi) / 2;
      if (fits(mid)) hi = mid;
      else lo = mid;
    }
    fits(hi);
    controls.update();
  }
  frameView();
  $('reset').addEventListener('click', frameView);

  // ── legend ─────────────────────────────────────────────────────────────
  const counts = {};
  entries.forEach(e => counts[e.form] = (counts[e.form] || 0) + 1);
  $('legend').innerHTML = forms.map(f => {
    const c = '#' + (FORM_META[f] || FORM_META.void).color.toString(16).padStart(6, '0');
    return `<div><i style="background:${c}"></i>${f}<span class="n">${counts[f]}</span></div>`;
  }).join('');
  $('scale').textContent = `สูง ×${VERTICAL_EXAG} · แกน Y = params.height · พื้น 512×512`;

  // ── hover ──────────────────────────────────────────────────────────────
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let hovered = null;

  renderer.domElement.addEventListener('pointermove', ev => {
    mouse.x = (ev.clientX / innerWidth) * 2 - 1;
    mouse.y = -(ev.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hit = raycaster.intersectObjects(pickable, false)[0];
    const obj = hit ? hit.object : null;

    if (hovered && hovered !== obj) hovered.material.emissiveIntensity = 0.04;
    hovered = obj;
    if (obj) obj.material.emissiveIntensity = 0.55;

    if (obj) {
      const d = obj.userData;
      const hh = d.params && d.params.height != null ? d.params.height : '—';
      tip.innerHTML = `<b>${d.id}</b> · ${d.form} · night ${d.night}\n`
        + `<span class="dim">h=${hh} · site ${d.site.x},${d.site.z}</span>\n`
        + `${d.title}\n<span class="dim">${d.journal || ''}</span>`;
      tip.style.display = 'block';
      tip.style.left = Math.min(ev.clientX + 16, innerWidth - 340) + 'px';
      tip.style.top = Math.min(ev.clientY + 16, innerHeight - 130) + 'px';
    } else {
      tip.style.display = 'none';
    }
  });
  renderer.domElement.addEventListener('pointerleave', () => {
    tip.style.display = 'none';
    if (hovered) hovered.material.emissiveIntensity = 0.04;
    hovered = null;
  });

  // Refit on resize unless the visitor has taken the camera somewhere. A wider
  // window used to be the only thing that kept every work on screen; a narrower
  // one silently cropped the plot.
  let userMoved = false;
  controls.addEventListener('start', () => { userMoved = true; });
  $('reset').addEventListener('click', () => { userMoved = false; });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (!userMoved) frameView();
  });

  // animated parts: spin on Y, or bob up and down
  let t0 = performance.now();
  (function animate(now) {
    requestAnimationFrame(animate);
    const t = (now - t0) / 1000;
    for (const a of anim) {
      if (a.mode === 'spin') a.m.rotation.y = t * a.speed * Math.PI / 180;
      else a.m.position.y = a.base + Math.sin(t * 0.8) * a.speed;
    }
    controls.update();
    renderer.render(scene, camera);
  })(t0);

  // diagnostic handle — lets the build be verified without a screenshot
  window.__ns = {
    group, scene, camera, entries, counts,
    heightOf: id => group.children.find(m => m.userData.id === id)?.userData._h,
  };
}

main().catch(e => {
  $('status').textContent = 'error: ' + (e && e.message ? e.message : e);
  console.error(e);
});
</script>
</body>
</html>
